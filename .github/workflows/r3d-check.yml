name: Check the RED R3D reader

# When the reader or its build changes: the R3D SDK from the draft release sdk-r3d (never in the repository), the
# parts of its headers the reader uses printed, and the reader built on Linux (the SDK ships Linux libraries too).
on:
  pull_request:
    branches: [main]
    paths: ['helper/r3d.cpp', 'scripts/r3d-build.sh', '.github/workflows/r3d-check.yml', 'package.json', 'src/media.js', 'src/main.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r3d:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Bring the SDK
        run: |
          gh release download sdk-r3d -R "$GITHUB_REPOSITORY" -D /tmp/r3dzip
          cd /tmp && unzip -q r3dzip/*.zip && ls /tmp/R3DSDK*
      - name: The headers the reader uses
        run: |
          I=$(ls -d /tmp/R3DSDK*/Include)
          grep -n "InitializeSdk\|FinalizeSdk\|OPTION_RED_NONE\|enum InitializeStatus" -A2 "$I/R3DSDK.h" | head -40
          grep -n "class Clip" -A3 "$I/R3DSDK.h" | head
          grep -n "Width()\|Height()\|VideoAudioFramerate\|VideoFrameCount\|Timecode(\|AbsoluteTimecode\|MetadataExists\|MetadataItemAsString\|AudioChannelCount\|AudioSampleRate\|AudioSampleCount\|DecodeAudio(\|DecodeVideoFrame(\|GetDefaultImageProcessingSettings\|Status()" "$I/R3DSDK.h" | head -40
          grep -n "PixelType_8Bit\|DECODE_FULL_RES_PREMIUM\|DECODE_HALF_RES_GOOD\|DECODE_QUARTER_RES_GOOD\|DECODE_EIGHT_RES_GOOD\|RMD_CAMERA_MODEL\b\|struct VideoDecodeJob\|class VideoDecodeJob" "$I"/*.h | head -30
          sed -n '/^struct VideoDecodeJob/,/^};/p' "$I/R3DSDKDefinitions.h" | head -80
          S=$(ls -d "/tmp/R3DSDK"*/"Sample code"); sed -n 1,200p "$S/Audio decode/ExtractAudioSample.cpp" | grep -v "^\s*//" | head -120
      - name: Build the reader on Linux
        run: |
          D=$(ls -d /tmp/R3DSDK*)
          g++ -std=c++17 -O2 -I "$D/Include" helper/r3d.cpp "$D/Lib/linux64/libR3DSDKPIC-cpp11.a" -ldl -lpthread -o /tmp/roarplay-r3d
          cp "$D"/Redistributable/linux/*.so /tmp/
          /tmp/roarplay-r3d info /nothing.R3D || echo "(no clip given: the error above is expected)"
      # Alex's own clip (draft release sdk-r3d-clip, from RoarTransfer): its facts, a frame at each scale with the
      # exact bytes, a small picture of it printed as base64 between markers to look at, a second of its sound
      - name: Alex's clip
        run: |
          gh release download sdk-r3d-clip -R "$GITHUB_REPOSITORY" -D /tmp/clip || { echo "no clip yet"; exit 0; }
          for P in /tmp/clip/*.part-aa; do if [ -e "$P" ]; then cat "${P%.part-aa}".part-* > "${P%.part-aa}" && rm "${P%.part-aa}".part-*; fi; done
          ls -la /tmp/clip
          C=$(ls /tmp/clip/*.R3D /tmp/clip/*.r3d 2>/dev/null | head -1); echo "clip: $C"
          cd /tmp
          INFO=$(./roarplay-r3d info "$C"); echo "info: $INFO"
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          for S in 1 2 4 8; do
            WH=$(node -e "const i=JSON.parse(process.argv[1]),s=+process.argv[2]; console.log(Math.floor(i.width/s)+'x'+Math.floor(i.height/s))" "$INFO" "$S")
            WANT=$(node -e "const [w,h]=process.argv[1].split('x'); console.log(w*h*4)" "$WH")
            GOT=$(./roarplay-r3d video "$C" 0 "$S" | head -c "$WANT" | wc -c)
            echo "scale $S ($WH): $GOT bytes, want $WANT"
          done
          WH=$(node -e "const i=JSON.parse(process.argv[1]); console.log(Math.floor(i.width/4)+'x'+Math.floor(i.height/4))" "$INFO")
          ./roarplay-r3d video "$C" 0 4 | ffmpeg -hide_banner -loglevel error -y -f rawvideo -pix_fmt bgra -s "$WH" -i pipe:0 -frames:v 1 -vf scale=480:-2 -q:v 6 look.jpg
          ls -la look.jpg; echo "==LOOK=="; base64 -w0 look.jpg; echo; echo "==END=="
          ./roarplay-r3d audio "$C" 0 | head -c 192000 | wc -c

  # the Mac build of the reader, as desktop.yml makes it, proved on Alex's clip
  r3d-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-ffmpeg.js darwin-arm64
      - run: FFMPEG=vendor/ffmpeg/darwin-arm64/ffmpeg bash scripts/r3d-build.sh
      # the same reader inside the packed app, as the person gets it, on Alex's clip
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: The reader inside the packed app
        run: |
          B="out/mac-arm64/RoarPlay.app/Contents/Resources/bin"; ls -la "$B"
          gh release download sdk-r3d-clip -R "$GITHUB_REPOSITORY" -D /tmp/clip || { echo "no clip"; exit 0; }
          C=$(ls /tmp/clip/*.R3D | head -1)
          "$B/roarplay-r3d" info "$C"
          "$B/roarplay-r3d" video "$C" 0 8 | head -c 1000000 | wc -c
