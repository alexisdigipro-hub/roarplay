    <radialGradient id="lit" cx="50%" cy="-8%" r="75%"><stop offset="0" stop-color="#7a828e" stop-opacity=".55"/><stop offset="1" stop-color="#7a828e" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="56%" r="46%"><stop offset="0" stop-color="#d40000" stop-opacity=".2"/><stop offset=".55" stop-color="#d40000" stop-opacity=".05"/><stop offset="1" stop-color="#d40000" stop-opacity="0"/></radialGradient>
    <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="780"><stop offset="0" stop-color="#ff5a4b"/><stop offset=".5" stop-color="#ec1a0c"/><stop offset="1" stop-color="#b80000"/></linearGradient>
